<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>StudyHub Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-image: url("bg.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* NAVBAR */

      .navbar {
        background: #111827;
      }

      .navbar-brand {
        font-size: 28px;
        font-weight: bold;
      }

      /* HERO */

      .hero {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px 0;

        background-image: url("bg.jpg");
        background-size: cover;
        background-position: center;
      }

      .hero img {
        width: 420px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      }

      /* SEARCH */

      .search-box {
        margin-top: 30px;
      }

      /* CARDS */

      .resource-card {
        border: none;
        border-radius: 20px;
        overflow: hidden;
        transition: 0.3s;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(5px);
      }

      .resource-card:hover {
        transform: translateY(-6px);
      }

      /* TOP COLOR */

      .top-section {
        padding: 30px 20px;
        text-align: center;
        color: white;
      }

      .pdf-bg {
        background: #dc3545;
      }

      .note-bg {
        background: #198754;
      }

      .link-bg {
        background: #0d6efd;
      }

      /* AVATAR */

      .avatar {
        width: 75px;
        height: 75px;
        border-radius: 50%;
        background: white;
        color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        font-size: 30px;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      .resource-title {
        margin-top: 15px;
        font-size: 24px;
        font-weight: bold;
      }

      .resource-type {
        font-size: 14px;
        opacity: 0.9;
      }

      /* CARD BODY */

      .card-body {
        text-align: center;
      }

      .subject {
        font-size: 18px;
        font-weight: bold;
      }

      .uploaded {
        color: gray;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark shadow">
      <div class="container">
        <a class="navbar-brand" href="#"> 📚 StudyHub </a>

        <div class="d-flex gap-2">
          <a href="upload.html" class="btn btn-primary"> Upload </a>

          <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
      </div>
    </nav>

    <!-- HERO IMAGE -->

    <div class="hero">
      <img src="Study hub pic.jpg" alt="StudyHub" />
    </div>

    <!-- SEARCH -->

    <div class="container search-box">
      <input
        type="text"
        id="search"
        class="form-control form-control-lg shadow-sm"
        placeholder="Search by title or subject"
      />
    </div>

    <!-- LIST -->

    <div class="container mt-4">
      <div class="row" id="list"></div>
    </div>

    <!-- NOTES MODAL -->

    <div class="modal fade" id="noteModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Notes</h5>

            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body" id="noteContent"></div>
        </div>
      </div>
    </div>

    <script>
      let allData = [];

      let user = localStorage.getItem("user");
      let role = localStorage.getItem("role");

      if (!user) {
        window.location = "login.html";
      }

      /* LOAD */

      function load() {
        fetch("http://localhost:3000/resources")
          .then((res) => res.json())

          .then((data) => {
            allData = data;

            display(data);
          });
      }

      /* DISPLAY */

      function display(data) {
        let output = "";

        data.forEach((r) => {
          let bgClass = "";

          if (r.type === "pdf") {
            bgClass = "pdf-bg";
          } else if (r.type === "note") {
            bgClass = "note-bg";
          } else {
            bgClass = "link-bg";
          }

          let typeText = "";

          if (r.type === "pdf") {
            typeText = "📄 PDF Resource";
          } else if (r.type === "note") {
            typeText = "📝 Notes";
          } else {
            typeText = "🔗 Link Resource";
          }

          let actionBtn = "";

          if (r.type === "link") {
            actionBtn = `
            <a href="${r.content}"
            target="_blank"
            class="btn btn-primary w-100 mb-2">
                Open Link
            </a>`;
          } else if (r.type === "note") {
            actionBtn = `
            <button
            class="btn btn-success w-100 mb-2"
            onclick="viewNote(\`${r.content}\`)">
                View Notes
            </button>`;
          } else if (r.type === "pdf") {
            actionBtn = `
            <a href="http://localhost:3000/uploads/${r.content}"
            target="_blank"
            class="btn btn-danger w-100 mb-2">
                Download PDF
            </a>`;
          }

          let deleteBtn = "";

          if (role === "admin" || r.user === user) {
            deleteBtn = `
            <button
            class="btn btn-outline-danger w-100"
            onclick="del('${r._id}')">
                Delete
            </button>`;
          }

          output += `

        <div class="col-md-4 col-lg-3 mb-4">

            <div class="card shadow-lg resource-card h-100">

                <!-- TOP -->

                <div class="top-section ${bgClass}">

                    <div class="avatar">
                        ${r.user.charAt(0).toUpperCase()}
                    </div>

                    <div class="resource-title">
                        ${r.title}
                    </div>

                    <div class="resource-type">
                        ${typeText}
                    </div>

                </div>

                <!-- BODY -->

                <div class="card-body">

                    <p class="subject">
                        ${r.subject}
                    </p>

                    <p class="uploaded">
                        Uploaded by
                        <br>
                        <b>${r.user}</b>
                    </p>

                    ${actionBtn}

                    ${deleteBtn}

                </div>

            </div>

        </div>

        `;
        });

        document.getElementById("list").innerHTML = output;
      }

      /* DELETE */

      function del(id) {
        fetch(`http://localhost:3000/delete/${id}?user=${user}&role=${role}`, {
          method: "DELETE",
        })
          .then((res) => res.text())

          .then((msg) => {
            if (msg === "Deleted") {
              load();
            } else {
              alert("❌ Not allowed");
            }
          });
      }

      /* VIEW NOTES */

      function viewNote(note) {
        document.getElementById("noteContent").innerText = note;

        new bootstrap.Modal(document.getElementById("noteModal")).show();
      }

      /* SEARCH */

      document.getElementById("search").addEventListener("keyup", function () {
        let key = this.value.toLowerCase();

        let filtered = allData.filter(
          (r) =>
            r.title.toLowerCase().includes(key) ||
            r.subject.toLowerCase().includes(key),
        );

        display(filtered);
      });

      /* LOGOUT */

      function logout() {
        localStorage.clear();

        window.location = "login.html";
      }

      /* INIT */

      load();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
