<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow-lg" style="width: 400px; border-radius:15px;">
    
    <h3 class="mb-3">Sign in</h3>
    <p class="text-muted">to continue to StudyHub</p>

    <input id="email" class="form-control mb-3" placeholder="Email">
    <input id="password" type="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-primary w-100 mb-2" onclick="login()">Login</button>

    <p class="text-center mt-2">
        New user? <a href="signup.html">Create account</a>
    </p>

</div>

<script>

function login(){

    fetch("http://localhost:3000/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            email: email.value,
            password: password.value
        })
    })

    .then(res=>res.json())
    .then(data=>{
        if(data.status==="success"){

            localStorage.setItem("user", data.email);
            localStorage.setItem("name", data.name);
            localStorage.setItem("role", data.role); // ✅ ADMIN

            window.location="dashboard.html";

        } else {
            alert("❌ Invalid login");
        }
    });

}

</script>

</body>
</html>
